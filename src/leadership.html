<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V2V Leaderboard</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
<div class="silk-bg"></div>
<div class="grain"></div>

<div class="app-shell" style="padding: 2rem; max-width: 800px; margin: 0 auto;">

    <header style="text-align: center; margin-bottom: 2rem;">
        <h1 class="brand" style="font-size: 2.5rem; margin-bottom: 0.5rem;">🏆 V2V Leaderboard</h1>
        <p style="color: #cbd5e1;">Top students mastering concepts through real-time voice and visuals.</p>
    </header>

    <div class="transcript" style="padding: 1.5rem;">
        <div class="transcript__header" style="display: flex; justify-content: space-between; align-items: center;">
            <span>Rankings</span>
            <span style="font-size: 1rem; color: #38bdf8;">Tower Score</span>
        </div>

        <div class="transcript__body" style="gap: 1rem;">

            <div class="glass" style="display: flex; justify-content: space-between; align-items: center; padding: 1rem; border-radius: 0.75rem;">
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <span style="font-size: 1.25rem; font-weight: bold; color: #facc15;">1</span>
                    <div>
                        <strong style="color: #f1f5f9;">Alex Chen</strong>
                        <p style="font-size: 0.85rem; color: #94a3b8;">Level: Advanced</p>
                    </div>
                </div>
                <span style="font-family: monospace; color: #34d399; font-weight: bold;">4,950 pts</span>
            </div>

            <div class="glass" style="display: flex; justify-content: space-between; align-items: center; padding: 1rem; border-radius: 0.75rem;">
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <span style="font-size: 1.25rem; font-weight: bold; color: #cbd5e1;">2</span>
                    <div>
                        <strong style="color: #f1f5f9;">Sarah Jenkins</strong>
                        <p style="font-size: 0.85rem; color: #94a3b8;">Level: Intermediate</p>
                    </div>
                </div>
                <span style="font-family: monospace; color: #34d399; font-weight: bold;">4,400 pts</span>
            </div>

            <div class="glass" style="display: flex; justify-content: space-between; align-items: center; padding: 1rem; border-radius: 0.75rem;">
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <span style="font-size: 1.25rem; font-weight: bold; color: #fb923c;">3</span>
                    <div>
                        <strong style="color: #f1f5f9;">Marcus Vance</strong>
                        <p style="font-size: 0.85rem; color: #94a3b8;">Level: Intermediate</p>
                    </div>
                </div>
                <span style="font-family: monospace; color: #34d399; font-weight: bold;">3,850 pts</span>
            </div>

        </div>
    </div>

    <div style="text-align: center; margin-top: 2rem;">
        <a href="index.html" class="pill-btn" style="text-decoration: none; padding: 0.75rem 1.5rem; background: rgba(255,255,255,0.1); border-radius: 9999px;">
            ← Back to Co-Pilot
        </a>
    </div>

</div>
</body>
</html>
