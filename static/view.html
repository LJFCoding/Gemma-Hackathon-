<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V2V Whiteboard</title>
  <style>
    body {
      margin: 0;
      background: #121212;
      color: white;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }
    .block {
      width: 100%;
      max-width: 500px;
      background: #1e1e1e;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 20px;
    }
    svg { width: 100%; height: auto; }
  </style>
</head>
<body>
  <h2>Live Whiteboard</h2>
  <div id="timeline"></div>

  <script>
    // Hardcoded test SVG — proves rendering works
    const testSvg = `
      <svg viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg">
        <circle cx="250" cy="150" r="50" fill="#6366f1" />
        <text x="250" y="230" fill="#fff" text-anchor="middle">Test Block 1</text>
      </svg>
    `;

    const container = document.createElement("div");
    container.className = "block";
    container.innerHTML = testSvg;
    document.getElementById("timeline").appendChild(container);
  </script>
</body>
</html>
